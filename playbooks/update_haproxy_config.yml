---
- name: Update HAProxy config on russia servers
  hosts: russia
  become: true

  vars:
    haproxy_stats_user: "{{ lookup('ansible.builtin.env', 'HAPROXY_STATS_USER') }}"
    haproxy_stats_password: "{{ lookup('ansible.builtin.env', 'HAPROXY_STATS_PASSWORD') }}"

  pre_tasks:
    - name: Validate HAProxy statistics credentials
      ansible.builtin.assert:
        that:
          - haproxy_stats_user | length > 0
          - haproxy_stats_password | length > 0
        fail_msg: "HAProxy statistics credentials are not configured"
      no_log: true

  tasks:
    - name: Check whether HAProxy is already installed
      ansible.builtin.stat:
        path: /usr/sbin/haproxy
      register: haproxy_bin

    # apt update + установка только если HAProxy на сервере ещё нет
    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: true
      when: not haproxy_bin.stat.exists

    - name: Deploy HAProxy config
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: "haproxy -c -f %s"
      notify: Restarted HAProxy

    - name: Ensure HAProxy is enabled and running
      ansible.builtin.service:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Restarted HAProxy
      ansible.builtin.service:
        name: haproxy
        state: restarted
