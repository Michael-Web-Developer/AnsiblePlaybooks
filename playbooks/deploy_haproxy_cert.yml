---
# Деплой wildcard-сертификата *.x.limita-net.ru для HAProxy.
# Хосты выбираются через --limit (в Semaphore — поле "Лимит" шаблона).
# ВНИМАНИЕ: запуск без --limit пройдёт по всем серверам инвентаря.
# PEM берётся из секрета x.limita-net.ru-pb-pk группы CERTIFICATES
# (тип "Variable" -> lookup('vars'), тип "Environment variable" -> lookup('env')).
- name: Deploy wildcard x.limita-net.ru certificate to HAProxy
  hosts: all
  become: true
  vars:
    cert_var_name: x.limita-net.ru-pb-pk
    cert_dir: /etc/haproxy/certs
    cert_path: "{{ cert_dir }}/wildcard-x.limita-net.ru.pem"
    cert_pem: "{{ lookup('vars', cert_var_name, default='') | default(lookup('env', cert_var_name), true) }}"

  tasks:
    - name: Check that certificate variable is set and looks like a PEM bundle
      ansible.builtin.assert:
        that:
          - cert_pem | length > 0
          - "'BEGIN CERTIFICATE' in cert_pem"
          - "'PRIVATE KEY' in cert_pem"
        fail_msg: >-
          Переменная {{ cert_var_name }} пуста или не содержит и сертификат, и приватный ключ.
          Проверь группу переменных CERTIFICATES.
        quiet: true

    # Semaphore/окружение могут потерять переносы строк (склеить PEM в одну строку
    # или заменить их на литеральные "\n"). Собираем PEM заново: каждый блок
    # BEGIN/END на своей строке, base64 внутри перебит по 64 символа.
    - name: Normalize PEM line structure
      ansible.builtin.set_fact:
        cert_pem_normalized: >-
          {%- set ns = namespace(out='') -%}
          {%- for block in (cert_pem | replace('\\n', '\n') | replace('\r', '')) | regex_findall('(?s)-----BEGIN ([A-Z0-9 ]+)-----(.*?)-----END \\1-----') -%}
          {%- set body = block[1] | regex_replace('\\s+', '') | regex_replace('(.{64})', '\\1\n') | trim -%}
          {%- set ns.out = ns.out ~ '-----BEGIN ' ~ block[0] ~ '-----\n' ~ body ~ '\n-----END ' ~ block[0] ~ '-----\n' -%}
          {%- endfor -%}
          {{ ns.out }}
      no_log: true

    - name: Check that PEM was parsed into certificate and key blocks
      ansible.builtin.assert:
        that:
          - "'-----BEGIN CERTIFICATE-----' in cert_pem_normalized"
          - "'PRIVATE KEY-----' in cert_pem_normalized"
        fail_msg: "Не удалось разобрать PEM из {{ cert_var_name }}: не найдены блоки BEGIN/END."
        quiet: true

    - name: Create HAProxy certs directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy certificate PEM
      ansible.builtin.copy:
        content: "{{ cert_pem_normalized }}"
        dest: "{{ cert_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Gather service facts
      ansible.builtin.service_facts:
