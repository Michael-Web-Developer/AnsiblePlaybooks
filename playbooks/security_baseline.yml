---
- name: Apply the initial security baseline
  hosts: "{{ hardening_target | default('us_tw_01') }}"
  become: true
  gather_facts: true

  vars:
    ansible_controller_ip: "89.19.209.254"

  pre_tasks:
    - name: Restrict this baseline to Debian-family systems
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This initial baseline supports Debian and Ubuntu only"

  tasks:
    - name: Install automatic security updates and Fail2ban
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - fail2ban
          - python3-systemd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable daily package-list and security-update processing
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Disable automatic reboot after unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

    - name: Configure the SSH Fail2ban jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1 {{ ansible_controller_ip }}
          usedns = no
          backend = systemd
          bantime = 1h
          findtime = 10m
          maxretry = 5
          bantime.increment = true
          bantime.factor = 2
          bantime.maxtime = 1d

          [sshd]
          enabled = true
          mode = normal
          port = ssh
      notify: Restart Fail2ban

    - name: Validate Fail2ban configuration
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Enable Fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Ensure automatic upgrade timers are enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

  handlers:
    - name: Restart Fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
      when: not ansible_check_mode
